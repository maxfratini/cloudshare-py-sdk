name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  binary:
    name: ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macos-13 was retired 2025-12-04 and macos-14 on 2026-11-02. Retired
      # labels do not fail -- they queue forever, which silently wedges the whole
      # matrix -- so use macos-15 (arm64) plus macos-15-intel for x86_64, the
      # last Intel image (available until ~August 2027).
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # A C toolchain is required: Nuitka compiles generated C.
      - name: Install build toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache patchelf

      - name: Sync
        run: uv sync --all-groups --locked

      # Build options come from the # nuitka-project comments in main.py,
      # which pick the right mode/flags per OS.
      - name: Compile with Nuitka
        run: uv run nuitka --remove-output main.py

      # Standalone output is dist/main.dist/mxcloudshare[.exe].
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN="dist/main.dist/mxcloudshare"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          if [ ! -f "$BIN" ]; then
            echo "::error::expected a binary at dist/main.dist, found:"
            ls -R dist || true
            exit 1
          fi
          chmod +x "$BIN" || true
          "$BIN" --help
          "$BIN" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mxcloudshare-${{ matrix.os }}
          path: |
            dist/main.dist/**
          include-hidden-files: true
          retention-days: 14